# GNN model registered as "gnn_model" in ModelCatalog.
custom_model: gnn_model
fcnet_hiddens: [128, 128]
fcnet_activation: relu
post_fcnet_hiddens: [128]
_enable_learner_api: false

encoder: null

gnn:
  hidden_dim: 256
  out_dim: 256
  num_layers: 3
  residual: true
  dropout_prob: 0.0
  conv_type: gat
  num_heads: 4
