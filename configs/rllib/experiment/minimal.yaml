defaults:
  - default  # inherits all keys from experiment/default.yaml

nb_timesteps: 1
checkpoint_freq: 1
# Not local mode: there an exception while building the algorithm never reaches Tune, which then
# waits forever instead of failing (seen with a mismatched imitation.weights_path, 2026-10-13).
ray_local_mode: false
folder_name: test_minimal
name: test_minimal

post_training_evaluation:
  enabled: true
  num_episodes: 1
  max_episode_length: 10 # only the first 10 steps
  visualize: false
